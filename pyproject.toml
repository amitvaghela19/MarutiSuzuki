[project]
name = "supply-chain-command-center"
version = "0.1.0"
description = "Supply Chain Command Center — demo analytics POC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.130",
  "uvicorn[standard]>=0.32.0,<0.35",
  "httpx>=0.27.0,<0.29",
  "duckdb>=1.1.0,<1.3",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "pyyaml>=6.0.2,<7",
  "numpy>=2.1.0,<3",
  "simpy>=4.1.0,<5",
  "feedparser>=6.0.11,<7",
  "python-dotenv>=1.0.0,<2",
  "jinja2>=3.1.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<0.26",
  "pytest-cov>=6.0.0,<7",
  "httpx>=0.27.0,<0.29",
  "pip-audit>=2.7.0,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
